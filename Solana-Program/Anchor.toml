[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.12"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vista_bridge = "9R7UWcCQVXW4dKKLYLLRfGQf5prePQBMyTEwd2TMC8sE"
vista_protocol = "4Jp9E68gcEMUXTwtm7suQ5wKq6U9jDRK4KPuRs6fReCM"
oracle_registry = "Arf7oEFm7jjaUXYW8of4moy553kczWXxdtf1bDSRpynn"
attention_aggregator = "6MJxBMfkocuzdbR5wJRvh31BAVPrUmk454yB9HnwvXtH"

[programs.localnet]
vista_bridge = "9R7UWcCQVXW4dKKLYLLRfGQf5prePQBMyTEwd2TMC8sE"
vista_protocol = "4Jp9E68gcEMUXTwtm7suQ5wKq6U9jDRK4KPuRs6fReCM"
oracle_registry = "Arf7oEFm7jjaUXYW8of4moy553kczWXxdtf1bDSRpynn"
attention_aggregator = "6MJxBMfkocuzdbR5wJRvh31BAVPrUmk454yB9HnwvXtH"

[provider]
# `localnet` so `anchor test` auto-spins up Surfpool (forks devnet state) for
# clean fresh validator state on every run. Pass `--provider.cluster devnet`
# explicitly when deploying or running scripts/devnet-e2e.ts against devnet.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
