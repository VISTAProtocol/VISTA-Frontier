[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vista_bridge = "VistaBridge11111111111111111111111111111111"
vista_protocol = "VistaProto111111111111111111111111111111111"

[programs.localnet]
vista_bridge = "VistaBridge11111111111111111111111111111111"
vista_protocol = "VistaProto111111111111111111111111111111111"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# Settlement token: Circle devnet USDC
# Mint:   4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
# Faucet: https://faucet.circle.com  (network: Solana, cluster: devnet)
# This mint is hardcoded in vista_protocol::USDC_MINT; rebuild to change it.

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Notes
# - Replace placeholder program IDs above with the real keys produced by
#   `anchor keys sync` after the first `anchor build`.
# - ORACLE_PRIVATE_KEY: signer that the off-chain oracle uses to call
#   start_stream / tick_stream / end_stream on `vista_protocol`.
