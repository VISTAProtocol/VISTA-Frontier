[package]
name = "vista_bridge"
version = "0.1.0"
edition = "2021"
description = "Vista cross-chain bridge program (LayerZero V2 receiver)"

[lib]
crate-type = ["cdylib", "lib"]
name = "vista_bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
